# Full local stack without Aspire (CI-like). Images are pinned.
#
#   ./deploy/init-secrets.ps1        (or: bash deploy/init-secrets.sh) - once, creates deploy/secrets/
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up --build
#
# Secrets are Docker secrets (files under /run/secrets), never environment variables or committed
# values. The host reads every file there as one configuration key (file name = key, "__" = ":").
#
# Database identities:
#   - postgres (schema owner)       -> only the one-shot "migrations" service
#   - modular_monolith_api (DML)    -> the "api" service; created by the migrator, member of modular_monolith_app
name: modular-monolith

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  db_owner_connection:
    file: ./secrets/ConnectionStrings__postgres-migrations
  db_api_connection:
    file: ./secrets/ConnectionStrings__postgres
  db_api_password:
    file: ./secrets/Migrations__ApplicationLoginPassword

x-app-image: &app-image
  build:
    context: ..
    dockerfile: Dockerfile
  image: modular-monolith-api:local

services:
  migrations:
    <<: *app-image
    command: [ "migrate" ]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Migrations__ApplicationLogin: modular_monolith_api
    secrets:
      - source: db_owner_connection
        target: ConnectionStrings__postgres-migrations
      - source: db_api_password
        target: Migrations__ApplicationLoginPassword
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  api:
    <<: *app-image
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__cache: valkey:6379
      Authentication__Authority: http://keycloak:8080/realms/modular-monolith
      # Traces and logs go to the collector (tail sampling, routing to Tempo and Loki).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Observability__OtlpLogs: "true"
    secrets:
      - source: db_api_connection
        target: ConnectionStrings__postgres
    depends_on:
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8081:8080"
    # Readiness: 200 only when dependencies are reachable and the host is not draining.
    # The chiseled image has no shell or curl, so the app probes itself (`healthcheck` command).
    healthcheck:
      test: [ "CMD", "dotnet", "ModularMonolith.Host.dll", "healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Must exceed Http:ShutdownDrainSeconds + Http:ShutdownTimeoutSeconds (5 + 25 by default).
    stop_grace_period: 45s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }
        reservations: { memory: 256M }

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: modular_monolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d modular_monolith" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  valkey:
    image: valkey/valkey:8.1.3-alpine
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    # The issuer is always http://localhost:8080 (what browsers/CLIs see), while back-channel calls
    # from the API container (discovery, JWKS) use the internal host name "keycloak".
    command: [ "start-dev", "--import-realm", "--hostname=http://localhost:8080", "--hostname-backchannel-dynamic=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: [ "--config=/etc/otelcol/config.yaml" ]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  tempo:
    image: grafana/tempo:2.8.2
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  loki:
    image: grafana/loki:3.5.3
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/loki.yaml:/etc/loki/local-config.yaml:ro
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    secrets:
      - grafana_admin_password
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

volumes:
  postgres-data:
