# Full local stack without Aspire (CI-like). Images are pinned; secrets come from deploy/.env
# (copy .env.example). Development defaults apply when a variable is unset.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up --build
#
# Database identities:
#   - postgres (schema owner)       -> only the one-shot "migrations" service
#   - modular_monolith_api (DML)    -> the "api" service; created by the migrator, member of modular_monolith_app
name: modular-monolith

x-app-image: &app-image
  build:
    context: ..
    dockerfile: Dockerfile
  image: modular-monolith-api:local

services:
  migrations:
    <<: *app-image
    command: [ "migrate" ]
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__postgres-migrations: Host=postgres;Port=5432;Database=modular_monolith;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Migrations__ApplicationLogin: modular_monolith_api
      Migrations__ApplicationLoginPassword: ${APP_DB_PASSWORD:-dev-only-api-password}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  api:
    <<: *app-image
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__postgres: Host=postgres;Port=5432;Database=modular_monolith;Username=modular_monolith_api;Password=${APP_DB_PASSWORD:-dev-only-api-password}
      ConnectionStrings__cache: valkey:6379
      Authentication__Authority: http://keycloak:8080/realms/modular-monolith
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      Observability__LokiUrl: http://loki:3100
    depends_on:
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "8081:8080"
    # Readiness: 200 only when dependencies are reachable and the host is not draining.
    # The runtime image has bash but no curl, so the probe uses /dev/tcp.
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Must exceed Http:ShutdownDrainSeconds + Http:ShutdownTimeoutSeconds (5 + 25 by default).
    stop_grace_period: 45s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }
        reservations: { memory: 256M }

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: modular_monolith
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d modular_monolith" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  valkey:
    image: valkey/valkey:8.1.3-alpine
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    # The issuer is always http://localhost:8080 (what browsers/CLIs see), while back-channel calls
    # from the API container (discovery, JWKS) use the internal host name "keycloak".
    command: [ "start-dev", "--import-realm", "--hostname=http://localhost:8080", "--hostname-backchannel-dynamic=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  tempo:
    image: grafana/tempo:2.8.2
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  loki:
    image: grafana/loki:3.5.3
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/loki.yaml:/etc/loki/local-config.yaml:ro
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

volumes:
  postgres-data:
