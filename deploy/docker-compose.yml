# Full local stack without Aspire (CI-like). Images are pinned; secrets come from deploy/.env
# (copy .env.example). Development defaults apply when a variable is unset.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up --build
name: modular-monolith

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__postgres: Host=postgres;Port=5432;Database=modular_monolith;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__cache: valkey:6379
      Authentication__Authority: http://keycloak:8080/realms/modular-monolith
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      Observability__LokiUrl: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "8081:8080"

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: modular_monolith
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d modular_monolith" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1.3-alpine
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    # The issuer is always http://localhost:8080 (what browsers/CLIs see), while back-channel calls
    # from the API container (discovery, JWKS) use the internal host name "keycloak".
    command: [ "start-dev", "--import-realm", "--hostname=http://localhost:8080", "--hostname-backchannel-dynamic=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  tempo:
    image: grafana/tempo:2.8.2
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.5.3
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/loki.yaml:/etc/loki/local-config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yaml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-data:
