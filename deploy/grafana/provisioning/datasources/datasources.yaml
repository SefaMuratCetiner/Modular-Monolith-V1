# Datasources with fixed UIDs so dashboards and cross-links are stable.
# Traces -> logs (Tempo -> Loki), logs -> traces (Loki derived field), metrics exemplars -> traces.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Logs pushed directly by the Serilog Loki sink (JSON line).
        - name: TraceId
          datasourceUid: tempo
          matcherRegex: '"TraceId":"(\w+)"'
          url: "$${__value.raw}"
        # Logs arriving through the OpenTelemetry Collector (trace_id as structured metadata).
        - name: trace_id
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
